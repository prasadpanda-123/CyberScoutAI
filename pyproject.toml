[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberscout-ai"
version = "0.1.0"
description = "Modular open-source Cybersecurity Opportunity Intelligence Platform."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "CyberScout AI Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/CyberScoutAI/cyberscout-ai"
Documentation = "https://github.com/CyberScoutAI/cyberscout-ai/tree/main/docs"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
