[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberscout-ai"
version = "1.1.3"
description = "Modular open-source Cybersecurity Opportunity Intelligence Platform."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "CyberScout AI Team" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "flask>=3.0.0",
    "gunicorn>=21.2.0",
    "jinja2>=3.1.3",
    "werkzeug>=3.0.1",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
]

[project.urls]
Homepage = "https://github.com/CyberScoutAI/cyberscout-ai"
Documentation = "https://github.com/CyberScoutAI/cyberscout-ai/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pyright]
include = ["src", "tests", "dashboard"]
extraPaths = ["."]
executionEnvironments = [
  { root = "." }
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
pythonpath = ["."]
testpaths = [
    "tests",
]
