<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - CyberScout AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#31394d",
                        "on-secondary": "#00354a",
                        "bg-card-hover": "#1E293B",
                        "outline": "#89929b",
                        "surface-container-lowest": "#060e20",
                        "text-muted": "#64748B",
                        "on-secondary-container": "#00374d",
                        "on-tertiary": "#4b2800",
                        "error-container": "#93000a",
                        "inverse-surface": "#dae2fd",
                        "primary": "#93ccff",
                        "surface-container": "#171f33",
                        "info": "#06B6D4",
                        "primary-fixed": "#cce5ff",
                        "on-primary-fixed": "#001d31",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-container": "#412200",
                        "on-secondary-fixed-variant": "#004c69",
                        "outline-variant": "#3f4850",
                        "surface-container-high": "#222a3d",
                        "danger": "#EF4444",
                        "on-tertiary-fixed": "#2d1600",
                        "primary-container": "#3198dc",
                        "surface-container-highest": "#2d3449",
                        "border-subtle": "#1E293B",
                        "surface-variant": "#2d3449",
                        "surface": "#0b1326",
                        "on-primary-container": "#002c47",
                        "warning": "#F59E0B",
                        "on-surface-variant": "#bfc7d2",
                        "on-background": "#dae2fd",
                        "text-secondary": "#94A3B8",
                        "primary-fixed-dim": "#93ccff",
                        "on-surface": "#dae2fd",
                        "secondary-fixed-dim": "#7bd0ff",
                        "error": "#ffb4ab",
                        "surface-dim": "#0b1326",
                        "bg-surface": "#0B0F19",
                        "secondary-fixed": "#c4e7ff",
                        "surface-container-low": "#131b2e",
                        "tertiary-fixed": "#ffdcc0",
                        "inverse-on-surface": "#283044",
                        "surface-tint": "#93ccff",
                        "tertiary-container": "#d07d1c",
                        "inverse-primary": "#006398",
                        "on-primary": "#003351",
                        "background": "#0b1326",
                        "tertiary": "#ffb875",
                        "on-primary-fixed-variant": "#004b73",
                        "secondary": "#7bd0ff",
                        "on-error": "#690005",
                        "secondary-container": "#00a6e0",
                        "admin-accent": "#EF4444",
                        "bg-body": "#070B14",
                        "on-secondary-fixed": "#001e2c",
                        "text-primary": "#F8FAFC",
                        "success": "#10B981",
                        "tertiary-fixed-dim": "#ffb875",
                        "on-tertiary-fixed-variant": "#6b3b00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "margin-mobile": "16px",
                        "margin-desktop": "32px",
                        "stack-md": "16px",
                        "sidebar-collapsed": "64px",
                        "stack-sm": "8px",
                        "stack-lg": "32px",
                        "sidebar-width": "280px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "headline-md": ["Inter", "sans-serif"],
                        "mono-code": ["JetBrains Mono", "monospace"],
                        "headline-sm": ["Inter", "sans-serif"],
                        "label-caps": ["Inter", "sans-serif"],
                        "display-kpi": ["Inter", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "headline-lg": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "mono-code": ["13px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-kpi": ["48px", { "lineHeight": "48px", "letterSpacing": "-0.04em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]

                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(11, 15, 25, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(137, 146, 155, 0.15);
        }
        
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(147,204,255,0.05) 0%, rgba(7,11,20,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        .input-icon-wrapper:focus-within .icon-element {
            color: theme('colors.primary');
        }
    </style>
</head>
<body class="bg-bg-body text-on-surface min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-body-md">
<!-- Background Atmospheric Glow -->
<div class="ambient-glow"></div>
<!-- Registration Container -->
<div class="glass-panel rounded-xl p-8 w-full max-w-[440px] z-10 shadow-[0_8px_32px_rgba(0,0,0,0.4)]">
<!-- Header -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-surface-container-high border border-border-subtle mb-4">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="font-headline-md text-headline-md text-text-primary mb-2">Create Account</h1>
<p class="font-body-md text-body-md text-text-muted">Initialize your access to the intelligence platform.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Username Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-text-secondary uppercase" for="username">Username</label>
<div class="relative input-icon-wrapper">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted icon-element transition-colors">person</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg pl-10 pr-4 py-2.5 text-on-surface font-body-md text-body-md placeholder:text-text-muted/40 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/30 transition-all shadow-inner" id="username" name="username" placeholder="operator_01" required="" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-text-secondary uppercase" for="email">Email Address</label>
<div class="relative input-icon-wrapper">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted icon-element transition-colors">mail</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg pl-10 pr-4 py-2.5 text-on-surface font-body-md text-body-md placeholder:text-text-muted/40 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/30 transition-all shadow-inner" id="email" name="email" placeholder="operator@domain.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-text-secondary uppercase" for="password">Password</label>
<div class="relative input-icon-wrapper">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted icon-element transition-colors">key</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg pl-10 pr-10 py-2.5 text-on-surface font-mono-code text-mono-code placeholder:text-text-muted/40 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/30 transition-all shadow-inner" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Password Strength Indicator -->
<div class="flex flex-col gap-1.5 -mt-2">
<div class="flex h-1 gap-1 w-full">
<div class="flex-1 bg-danger rounded-full shadow-[0_0_8px_rgba(239,68,68,0.3)]"></div>
<div class="flex-1 bg-warning rounded-full shadow-[0_0_8px_rgba(245,158,11,0.3)]"></div>
<div class="flex-1 bg-surface-container-highest rounded-full"></div>
<div class="flex-1 bg-surface-container-highest rounded-full"></div>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-[11px] text-text-muted">Must be at least 12 characters.</span>
<span class="font-label-caps text-[10px] text-warning uppercase">Fair</span>
</div>
</div>
<!-- Confirm Password Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-text-secondary uppercase" for="confirm_password">Confirm Password</label>
<div class="relative input-icon-wrapper">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted icon-element transition-colors">lock</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg pl-10 pr-4 py-2.5 text-on-surface font-mono-code text-mono-code placeholder:text-text-muted/40 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/30 transition-all shadow-inner" id="confirm_password" name="confirm_password" placeholder="••••••••••••" required="" type="password"/>
</div>
</div>
<!-- Privacy Policy Checkbox -->
<div class="flex items-start gap-3 mt-2">
<div class="flex items-center h-5">
<input class="w-4 h-4 bg-surface-container-low border-outline-variant rounded text-primary focus:ring-primary focus:ring-offset-bg-body focus:ring-offset-2 transition-colors cursor-pointer" id="privacy_policy" name="privacy_policy" required="" type="checkbox"/>
</div>
<label class="font-body-md text-body-md text-text-secondary text-[13px] leading-tight cursor-pointer" for="privacy_policy">
                    I acknowledge that I have read and agree to the 
                    <a class="text-primary hover:text-primary-fixed hover:underline transition-colors" href="#">Privacy Policy</a> and 
                    <a class="text-primary hover:text-primary-fixed hover:underline transition-colors" href="#">Terms of Service</a>.
                </label>
</div>
<!-- Submit Action -->
<button class="w-full mt-4 bg-primary text-on-primary-container font-headline-sm text-headline-sm py-3 rounded-lg hover:bg-primary-container transition-all hover:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-bg-body shadow-[0_0_15px_rgba(147,204,255,0.15)]" type="submit">
                Initialize Account
            </button>
</form>
<!-- Footer Link -->
<div class="text-center mt-8 pt-6 border-t border-border-subtle">
<p class="font-body-md text-body-md text-text-muted">
                Already have an account? 
                <a class="text-primary font-medium hover:text-primary-fixed hover:underline transition-colors ml-1" href="/login">Login</a>
</p>
</div>
</div>
</body></html>
