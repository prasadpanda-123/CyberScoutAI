<style>
        .admin-glow {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.15);
        }
        .admin-focus-ring:focus {
            box-shadow: 0 0 0 2px rgba(7, 11, 20, 1), 0 0 0 4px rgba(239, 68, 68, 0.5);
        }
        .otp-input::-webkit-outer-spin-button,
        .otp-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .otp-input {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-bg-body text-text-primary min-h-screen flex items-center justify-center p-4 antialiased selection:bg-admin-accent/30 selection:text-admin-accent">
<!-- Decorative background elements -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-admin-accent/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-surface-container-high/50 blur-[100px]"></div>
</div>
<!-- Main Container -->
<div class="relative z-10 w-full max-w-md">
<!-- Verification Card -->
<div class="bg-surface border border-border-subtle rounded-xl p-8 admin-glow relative overflow-hidden">
<!-- Admin Boundary Indicator -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-admin-accent to-transparent opacity-80"></div>
<!-- Header -->
<div class="flex flex-col items-center mb-8 text-center">
<div class="w-16 h-16 rounded-full bg-admin-accent/10 flex items-center justify-center mb-4 border border-admin-accent/20">
<span class="material-symbols-outlined text-admin-accent text-3xl" style="font-variation-settings: 'FILL' 1;">enhanced_encryption</span>
</div>
<h1 class="font-headline-md text-headline-md text-text-primary mb-2">Two-Factor Authentication</h1>
<p class="font-body-md text-body-md text-text-secondary max-w-[280px]">
                    Enter the 6-digit verification code sent to your registered security device.
                </p>
</div>
<!-- Verification Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Code Input Group -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-3 text-center" for="otp-input">
                        Authentication Code
                    </label>
<div class="flex justify-center gap-2" id="otp-container">
<input autocomplete="off" autofocus="" class="w-12 h-14 text-center font-mono-code text-headline-lg bg-bg-body border border-border-subtle rounded-lg text-text-primary focus:border-admin-accent admin-focus-ring transition-all outline-none" maxlength="1" type="text"/>
<input autocomplete="off" class="w-12 h-14 text-center font-mono-code text-headline-lg bg-bg-body border border-border-subtle rounded-lg text-text-primary focus:border-admin-accent admin-focus-ring transition-all outline-none" maxlength="1" type="text"/>
<input autocomplete="off" class="w-12 h-14 text-center font-mono-code text-headline-lg bg-bg-body border border-border-subtle rounded-lg text-text-primary focus:border-admin-accent admin-focus-ring transition-all outline-none" maxlength="1" type="text"/>
<span class="text-text-secondary flex items-center justify-center w-4">-</span>
<input autocomplete="off" class="w-12 h-14 text-center font-mono-code text-headline-lg bg-bg-body border border-border-subtle rounded-lg text-text-primary focus:border-admin-accent admin-focus-ring transition-all outline-none" maxlength="1" type="text"/>
<input autocomplete="off" class="w-12 h-14 text-center font-mono-code text-headline-lg bg-bg-body border border-border-subtle rounded-lg text-text-primary focus:border-admin-accent admin-focus-ring transition-all outline-none" maxlength="1" type="text"/>
<input autocomplete="off" class="w-12 h-14 text-center font-mono-code text-headline-lg bg-bg-body border border-border-subtle rounded-lg text-text-primary focus:border-admin-accent admin-focus-ring transition-all outline-none" maxlength="1" type="text"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-12 bg-admin-accent hover:bg-danger text-white rounded-lg font-label-caps text-label-caps tracking-wider transition-all duration-150 flex items-center justify-center gap-2 group hover:scale-[0.98] admin-glow border border-admin-accent/50 hover:border-admin-accent" type="button">
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">verified_user</span>
                    VERIFY IDENTITY
                </button>
</form>
<!-- Footer / Resend -->
<div class="mt-8 pt-6 border-t border-border-subtle text-center">
<div class="flex items-center justify-center gap-2 mb-2">
<span class="material-symbols-outlined text-warning text-[16px]">schedule</span>
<span class="font-mono-code text-mono-code text-text-secondary">Code expires in <span class="text-text-primary font-medium">04:59</span></span>
</div>
<button class="font-body-md text-body-md text-admin-accent hover:text-danger hover:underline transition-colors focus:outline-none" type="button">
                    Resend authentication code
                </button>
</div>
<!-- Security Notice -->
<div class="mt-6 flex items-start gap-3 p-3 rounded-lg bg-surface-container-high/50 border border-border-subtle">
<span class="material-symbols-outlined text-text-muted text-[18px] mt-0.5">info</span>
<p class="font-body-md text-[12px] leading-[18px] text-text-muted text-left">
                    Admin access is monitored and logged. Ensure you are operating in a secure environment before proceeding.
                </p>
</div>
</div>
<!-- Back to Login -->
<div class="mt-6 text-center">
<a class="inline-flex items-center gap-1 font-body-md text-body-md text-text-secondary hover:text-text-primary transition-colors focus:outline-none admin-focus-ring rounded px-2 py-1" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                Return to Login
            </a>
</div>
</div>
<script>
        // Simple auto-focus logic for OTP inputs
        const inputs = document.querySelectorAll('#otp-container input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
            
            // Allow only numbers
            input.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });
    </script>
</body></html>
