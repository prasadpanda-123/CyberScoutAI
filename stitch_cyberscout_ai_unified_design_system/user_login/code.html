<style>
        .brand-glow {
            box-shadow: 0 0 15px rgba(147, 204, 255, 0.15);
        }
        .admin-glow {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.15);
        }

</head>
<body class="bg-body text-text-primary min-h-screen flex items-center justify-center font-body-md overflow-hidden relative">
<!-- Ambient Background Effect -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[40%] h-[40%] rounded-full bg-admin-accent/5 blur-[100px]"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<div class="bg-surface border border-border-subtle rounded-xl p-stack-lg shadow-2xl relative overflow-hidden">
<!-- Subtle Top Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-secondary"></div>
<!-- Header -->
<div class="text-center mb-stack-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-lg bg-surface-container border border-border-subtle mb-stack-md">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="font-headline-md text-headline-md text-text-primary">CyberScout AI</h1>
<p class="font-body-md text-body-md text-text-muted mt-stack-sm">Secure Authentication Gateway</p>
</div>
<!-- Error State Container (Hidden by default, shown for demonstration) -->
<div class="hidden mb-stack-md bg-error-container/20 border border-danger/30 rounded-lg p-stack-sm flex items-start gap-3" id="error-container">
<span class="material-symbols-outlined text-danger mt-0.5" style="font-variation-settings: 'FILL' 1;">error</span>
<div class="flex-1">
<p class="font-body-md text-body-md text-error">Authentication Failed</p>
<p class="font-body-md text-body-md text-error/80 text-sm mt-1">Invalid credentials provided. Please verify your identifier and password.</p>
</div>
</div>
<!-- Form -->
<form action="#" class="space-y-stack-md" id="loginForm" method="POST">
<!-- CSRF Token (Hidden) -->
<input name="csrf_token" type="hidden" value="example-csrf-token-12345"/>
<!-- Identifier Field -->
<div>
<label class="block font-label-caps text-label-caps text-text-secondary mb-2" for="identifier">Identifier (Username/Email)</label>
<div class="relative group">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-text-muted group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">person</span>
</span>
<input autocomplete="username" class="w-full bg-body border border-border-subtle rounded-lg py-2.5 pl-10 pr-4 font-mono-code text-mono-code text-text-primary placeholder:text-text-muted focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all focus:brand-glow" id="identifier" name="identifier" placeholder="sysadmin@cyberscout.io" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-caps text-label-caps text-text-secondary" for="password">Password</label>
<a class="font-body-md text-body-md text-[13px] text-primary hover:text-secondary transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative group">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-text-muted group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</span>
<input autocomplete="current-password" class="w-full bg-body border border-border-subtle rounded-lg py-2.5 pl-10 pr-10 font-mono-code text-mono-code text-text-primary placeholder:text-text-muted focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all focus:brand-glow" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-text-muted hover:text-text-primary transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibilityIcon">visibility</span>
</button>
</div>
</div>
<!-- Submit Action -->
<div class="pt-stack-sm">
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-3 rounded-lg hover:bg-secondary hover:scale-[0.98] transition-all duration-200 brand-glow flex justify-center items-center gap-2" type="submit">
<span>Authenticate</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</div>
</form>
<!-- Registration Link -->
<div class="mt-stack-lg text-center border-t border-border-subtle pt-stack-md">
<p class="font-body-md text-body-md text-text-muted">
                    Don't have an account? <a class="text-primary hover:text-secondary transition-colors font-semibold" href="#">Register here</a>
</p>
</div>
</div>
<!-- Environment Indicator -->
<div class="text-center mt-stack-md">
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high border border-border-subtle font-mono-code text-[11px] text-text-secondary">
<span class="w-2 h-2 rounded-full bg-success animate-pulse"></span>
                System Operational (US-EAST-1)
            </span>
</div>
</main>
<script>
        // Password Visibility Toggle
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('visibilityIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        });

        // Simulate Error State for Demonstration (Optional logic)
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // In a real app, this would be handled server-side. 
            // For UI demonstration, we show the error state if identifier is 'error'
            const identifier = document.getElementById('identifier').value;
            const errorContainer = document.getElementById('error-container');
            
            if(identifier === 'error') {
                errorContainer.classList.remove('hidden');
                // Trigger shake animation on container
                const container = errorContainer.parentElement;
                container.style.animation = 'none';
                container.offsetHeight; /* trigger reflow */
                container.style.animation = 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both';
            } else {
                errorContainer.classList.add('hidden');
                // Simulate success/redirect
                const btn = this.querySelector('button[type="submit"]');
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span><span>Authenticating...</span>';
                setTimeout(() => {
                    btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span><span>Authenticated</span>';
                    btn.classList.replace('bg-primary', 'bg-success');
                    btn.classList.replace('text-on-primary', 'text-background');
                }, 1000);
            }
        });
    </script>
<style>
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</body></html>
