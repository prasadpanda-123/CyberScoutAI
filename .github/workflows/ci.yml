name: CyberScout AI CI

on:
  push:
    branches: [ main, feature/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Run Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        python-version: ['3.12']

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cyberscout_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run System Diagnostics & Health Check
        env:
          TESTING: "true"
          SECRET_DB_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          export TEST_DATABASE_URL="${SECRET_DB_URL:-postgresql://postgres:postgres@localhost:5432/cyberscout_test}"
          export DATABASE_URL="$TEST_DATABASE_URL"
          python main.py --version
          python main.py --config-check
          python main.py --db-check
          python main.py --health

      - name: Execute Automated Unit Test Suite
        env:
          TESTING: "true"
          SECRET_DB_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          export TEST_DATABASE_URL="${SECRET_DB_URL:-postgresql://postgres:postgres@localhost:5432/cyberscout_test}"
          export DATABASE_URL="$TEST_DATABASE_URL"
          python -m unittest discover -s tests/unit -v
