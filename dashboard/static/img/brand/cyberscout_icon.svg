<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background / Glow Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070b14" stop-opacity="0" />
    </radialGradient>
    
    <!-- Shield Outer Gradient -->
    <linearGradient id="shieldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Shield Inner Fill Gradient -->
    <linearGradient id="shieldInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070d1a" stop-opacity="0.98" />
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Violet Accent Gradient -->
    <linearGradient id="violetAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Core Eye Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="240" r="210" fill="url(#bgGlow)" />

  <!-- Shield Outer Geometry (Faceted Cyber Shield) -->
  <path d="M256 42 L424 106 V242 C424 338 352 422 256 468 C160 422 88 338 88 242 V106 L256 42 Z" 
        stroke="url(#shieldBorderGrad)" 
        stroke-width="12" 
        stroke-linejoin="round" 
        stroke-linecap="round" 
        fill="url(#shieldInnerGrad)" />

  <!-- Inner Shield Inset Facet Line -->
  <path d="M256 74 L396 128 V236 C396 316 336 388 256 430 C176 388 116 316 116 236 V128 L256 74 Z" 
        stroke="#1e293b" 
        stroke-width="4" 
        fill="none" 
        opacity="0.8" />

  <!-- Neural Network / Constellation Grid Lines in Lower Shield -->
  <g stroke="#0284c7" stroke-width="3" opacity="0.6" stroke-linecap="round">
    <line x1="256" y1="340" x2="256" y2="420" />
    <line x1="256" y1="340" x2="190" y2="380" />
    <line x1="256" y1="340" x2="322" y2="380" />
    <line x1="190" y1="380" x2="150" y2="320" />
    <line x1="322" y1="380" x2="362" y2="320" />
    <line x1="150" y1="320" x2="150" y2="250" />
    <line x1="362" y1="320" x2="362" y2="250" />
  </g>

  <!-- Neural Network Nodes -->
  <g fill="#00f0ff" filter="url(#neonGlow)">
    <circle cx="256" cy="420" r="5" fill="#818cf8" />
    <circle cx="190" cy="380" r="5" />
    <circle cx="322" cy="380" r="5" />
    <circle cx="150" cy="320" r="5.5" />
    <circle cx="362" cy="320" r="5.5" />
    <circle cx="150" cy="250" r="4.5" fill="#818cf8" />
    <circle cx="362" cy="250" r="4.5" fill="#818cf8" />
  </g>

  <!-- Radar / Scout Scanning Rings (Central Intelligence Aperture) -->
  <g filter="url(#neonGlow)">
    <!-- Outer Radar Track -->
    <circle cx="256" cy="226" r="92" stroke="#0284c7" stroke-width="4" stroke-dasharray="14 10" opacity="0.75" />
    
    <!-- Middle Precision Reticle Ring -->
    <circle cx="256" cy="226" r="70" stroke="url(#cyanAccent)" stroke-width="7" />
    
    <!-- Crosshair Ticks -->
    <line x1="256" y1="138" x2="256" y2="152" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" />
    <line x1="256" y1="300" x2="256" y2="314" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" />
    <line x1="168" y1="226" x2="182" y2="226" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" />
    <line x1="330" y1="226" x2="344" y2="226" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" />

    <!-- Radar Sweep Beam / Scout Ray -->
    <path d="M256 226 L314 168 A 82 82 0 0 0 256 144 Z" fill="url(#cyanAccent)" opacity="0.35" />
    <line x1="256" y1="226" x2="314" y2="168" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" />
    
    <!-- Core Scout Pupil / Aperture Ring -->
    <circle cx="256" cy="226" r="40" stroke="url(#violetAccent)" stroke-width="5" fill="#0b132b" />
    <circle cx="256" cy="226" r="22" fill="url(#cyanAccent)" />
    <circle cx="256" cy="226" r="9" fill="#ffffff" />
  </g>
</svg>
