<div class="sidebar p-3 d-flex flex-column justify-content-between h-100">
  <ul class="nav nav-pills flex-column mb-auto">
    <li class="nav-item">
      <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
        <i class="bi bi-speedometer2 me-2"></i> Dashboard
      </a>
    </li>
    <li class="nav-item">
      <a href="/opportunities" class="nav-link {% if active_page == 'opportunities' %}active{% endif %}">
        <i class="bi bi-briefcase me-2"></i> Opportunities
      </a>
    </li>
    <li class="nav-item">
      <a href="/analytics" class="nav-link {% if active_page == 'analytics' %}active{% endif %}">
        <i class="bi bi-graph-up me-2"></i> Analytics
      </a>
    </li>
    <li class="nav-item">
      <a href="/reports" class="nav-link {% if active_page == 'reports' %}active{% endif %}">
        <i class="bi bi-file-earmark-arrow-down me-2"></i> Reports Center
      </a>
    </li>
  </ul>

  <!-- Active User Account Footer Card -->
  <div class="card p-3 mt-4">
    <div class="d-flex align-items-center justify-content-between">
      <div class="truncate me-2">
        <div class="fw-bold small truncate">{{ current_user.username }}</div>
        <span class="badge {% if current_user.role == 'Super Admin' %}bg-danger{% elif current_user.role == 'Administrator' %}bg-primary{% else %}bg-secondary{% endif %} font-monospace" style="font-size: 10px;">{{ current_user.role }}</span>
      </div>
      <a href="/logout" class="btn btn-sm btn-outline-danger" title="Sign Out"><i class="bi bi-box-arrow-right"></i></a>
    </div>
  </div>
</div>
