<nav class="navbar navbar-dark sticky-top px-3">
  <a class="navbar-brand d-flex align-items-center text-light fw-bold" href="/">
    <i class="bi bi-shield-lock-fill text-primary me-2 fs-4"></i> CyberScout AI <span class="badge bg-secondary ms-2 fs-6">v1.1.0</span>
  </a>
  <div class="d-flex align-items-center">
    <button class="btn btn-outline-primary btn-sm me-2" onclick="triggerScan()"><i class="bi bi-play-circle me-1"></i> Run Scan Now</button>
    <span class="badge bg-success me-3"><i class="bi bi-check-circle me-1"></i> System Healthy</span>
  </div>
</nav>
<script>
function triggerScan() {
  fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dry_run: true }) })
    .then(r => r.json())
    .then(d => alert('Scan completed! Collected ' + d.items_collected + ' items.'))
    .catch(e => alert('Error running scan: ' + e));
}
</script>
