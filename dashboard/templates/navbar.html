<!-- Mobile-Only Compact Header (Hidden on Desktop) -->
<div class="mobile-header d-flex d-md-none align-items-center justify-content-between px-3 py-2 border-bottom border-secondary-subtle sticky-top bg-surface">
  <div class="d-flex align-items-center">
    <!-- Mobile Sidebar Toggle -->
    <button class="btn btn-outline-secondary btn-sm me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas" aria-controls="sidebarOffcanvas" aria-label="Toggle Navigation">
      <i class="bi bi-list fs-5"></i>
    </button>
    <a class="navbar-brand d-flex align-items-center fw-bold mb-0 text-primary" href="/dashboard">
      <img src="{{ url_for('static', filename='images/cyberscout-icon.svg') }}" alt="CyberScout AI" class="w-6 h-6 object-contain me-2"> CyberScout AI
    </a>
  </div>
  {% if session.get('role') in ['Admin', 'Super Admin', 'Administrator'] or session.get('admin_authenticated') %}
    <a href="/admin/dashboard" class="btn btn-sm btn-warning fw-semibold"><i class="bi bi-shield-lock me-1"></i> Admin</a>
  {% endif %}
</div>

<!-- Scan Status Modal -->
<div class="modal fade" id="scanModal" tabindex="-1" aria-labelledby="scanModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="scanModalLabel"><i class="bi bi-cpu text-primary me-2"></i> CyberScout AI Scan Execution</h5>
        <button type="button" class="btn-close d-none" data-bs-dismiss="modal" aria-label="Close" id="scanModalCloseBtn"></button>
      </div>
      <div class="modal-body py-4 text-center">
        <div id="scanSpinner" class="spinner-border text-primary mb-3 w-12 h-12" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <div id="scanSuccessIcon" class="mb-3 text-success fs-1 d-none">
          <i class="bi bi-check-circle-fill"></i>
        </div>
        <h5 id="scanStatusTitle" class="fw-bold mb-2">Starting scan...</h5>
        <p id="scanStatusSub" class="text-muted small mb-0">Initializing search planner and collectors...</p>
      </div>
      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-secondary btn-sm d-none" data-bs-dismiss="modal" id="scanModalFooterBtn" onclick="window.location.reload();">Close & Refresh</button>
      </div>
    </div>
  </div>
</div>

<script nonce="{{ csp_nonce }}">
function triggerScan() {
  const btn = document.getElementById('runScanBtn');
  const modalEl = document.getElementById('scanModal');
  const title = document.getElementById('scanStatusTitle');
  const sub = document.getElementById('scanStatusSub');
  const spinner = document.getElementById('scanSpinner');
  const icon = document.getElementById('scanSuccessIcon');
  const closeBtn = document.getElementById('scanModalCloseBtn');
  const footerBtn = document.getElementById('scanModalFooterBtn');

  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i> Scanning...';
  }

  spinner.classList.remove('d-none');
  spinner.classList.add('d-inline-block');
  icon.classList.add('d-none');
  closeBtn.classList.add('d-none');
  footerBtn.classList.add('d-none');

  title.innerText = 'Starting scan...';
  sub.innerText = 'Initializing search planner and collectors...';

  const modal = new bootstrap.Modal(modalEl);
  modal.show();

  fetch('/admin/api/run', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRF-Token': '{{ csrf_token }}'
    },
    body: JSON.stringify({ dry_run: false, csrf_token: '{{ csrf_token }}' })
  })
    .then(async r => {
      const data = await r.json();
      if (r.status === 409) {
        throw new Error(data.error || 'A scan is already in progress.');
      }
      if (!data.success && !data.job_id) {
        throw new Error(data.error || 'Failed to initialize scan job');
      }
      return data;
    })
    .then(data => {
      const jobId = data.job_id;
      title.innerText = 'Scan Queued...';
      sub.innerText = 'Job ID: ' + jobId;

      const pollInterval = setInterval(() => {
        fetch('/admin/api/jobs/' + jobId)
          .then(res => {
            if (!res.ok) {
              clearInterval(pollInterval);
              title.innerText = 'Scan Completed';
              sub.innerText = 'Job ' + jobId + ' is complete.';
              spinner.classList.add('d-none');
              icon.classList.remove('d-none');
              closeBtn.classList.remove('d-none');
              footerBtn.classList.remove('d-none');
              if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-play-circle me-1"></i> Run Scan Now';
              }
              return null;
            }
            return res.json();
          })
          .then(job => {
            if (!job || !job.status || job.error) {
              clearInterval(pollInterval);
              return;
            }
            
            const pct = Math.round(job.progress || 0);
            title.innerText = `Scanning... ${pct}%`;
            sub.innerText = `Phase: ${job.status.toUpperCase()} | ${job.current_collector} (${job.opportunities_found} found, ${job.elapsed_time}s)`;

            if (job.status === 'completed') {
              clearInterval(pollInterval);
              title.innerText = 'Completed';
              sub.innerText = `✔ Scan Complete! Found ${job.opportunities_found} opportunities in ${job.elapsed_time}s.`;
              sub.className = 'text-success fw-bold fs-6 mb-0';

              spinner.classList.add('d-none');
              icon.classList.remove('d-none');
              closeBtn.classList.remove('d-none');
              footerBtn.classList.remove('d-none');

              if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-play-circle me-1"></i> Run Scan Now';
              }

              setTimeout(() => {
                window.location.reload();
              }, 1500);
            } else if (job.status === 'failed') {
              clearInterval(pollInterval);
              title.innerText = 'Scan Failed';
              const errText = (job.errors && job.errors.length) ? job.errors.join('; ') : 'Pipeline execution failed';
              sub.innerText = 'Error: ' + errText;
              sub.className = 'text-danger mb-0';

              spinner.classList.add('d-none');
              closeBtn.classList.remove('d-none');
              footerBtn.classList.remove('d-none');

              if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-play-circle me-1"></i> Run Scan Now';
              }
            }
          })
          .catch(pollErr => {
            console.error('Job polling error:', pollErr);
          });
      }, 2500);
    })
    .catch(e => {
      title.innerText = 'Scan Notice';
      sub.innerText = String(e.message || e);
      sub.className = 'text-warning fw-bold mb-0';

      spinner.classList.add('d-none');
      closeBtn.classList.remove('d-none');
      footerBtn.classList.remove('d-none');

      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-play-circle me-1"></i> Run Scan Now';
      }
    });
}
</script>
