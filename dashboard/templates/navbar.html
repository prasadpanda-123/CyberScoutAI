<nav class="navbar sticky-top px-3">
  <a class="navbar-brand d-flex align-items-center fw-bold" href="/">
    <i class="bi bi-shield-lock-fill text-primary me-2 fs-4"></i> CyberScout AI <span class="badge bg-primary ms-2 fs-6">v2.1</span>
  </a>
  <div class="d-flex align-items-center">
    <!-- Dark / Light Theme Toggle Button -->
    <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm me-3" onclick="toggleTheme()" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
      <i id="themeToggleIcon" class="bi bi-sun-fill text-warning"></i>
    </button>

    {% if current_user.is_authenticated %}
      <span class="small me-3"><i class="bi bi-person-circle me-1 text-info"></i> {{ current_user.username }} <span class="badge bg-secondary font-monospace ms-1">{{ current_user.role }}</span></span>
      <a href="/logout" class="btn btn-outline-danger btn-sm" title="Sign Out"><i class="bi bi-box-arrow-right"></i></a>
    {% else %}
      <a href="/login" class="btn btn-primary btn-sm me-2">Sign In</a>
      <a href="/register" class="btn btn-outline-success btn-sm">Register</a>
    {% endif %}
  </div>
</nav>

<!-- Scan Status Modal -->
<div class="modal fade" id="scanModal" tabindex="-1" aria-labelledby="scanModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="scanModalLabel"><i class="bi bi-cpu text-primary me-2"></i> CyberScout AI Scan Execution</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="scanModalCloseBtn" style="display: none;"></button>
      </div>
      <div class="modal-body py-4 text-center">
        <div id="scanSpinner" class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <div id="scanSuccessIcon" class="mb-3 text-success fs-1" style="display: none;">
          <i class="bi bi-check-circle-fill"></i>
        </div>
        <h5 id="scanStatusTitle" class="fw-bold mb-2">Starting scan...</h5>
        <p id="scanStatusSub" class="text-muted small mb-0">Initializing search planner and collectors...</p>
      </div>
      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" id="scanModalFooterBtn" style="display: none;" onclick="window.location.reload();">Close & Refresh</button>
      </div>
    </div>
  </div>
</div>

<script>
function triggerScan() {
  const btn = document.getElementById('runScanBtn');
  const modalEl = document.getElementById('scanModal');
  const title = document.getElementById('scanStatusTitle');
  const sub = document.getElementById('scanStatusSub');
  const spinner = document.getElementById('scanSpinner');
  const icon = document.getElementById('scanSuccessIcon');
  const closeBtn = document.getElementById('scanModalCloseBtn');
  const footerBtn = document.getElementById('scanModalFooterBtn');

  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i> Scanning...';
  }

  spinner.style.display = 'inline-block';
  icon.style.display = 'none';
  closeBtn.style.display = 'none';
  footerBtn.style.display = 'none';

  title.innerText = 'Starting scan...';
  sub.innerText = 'Initializing search planner and collectors...';

  const modal = new bootstrap.Modal(modalEl);
  modal.show();

  fetch('/api/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dry_run: false })
  })
    .then(async r => {
      const data = await r.json();
      if (r.status === 409) {
        throw new Error(data.error || 'A scan is already in progress.');
      }
      if (!data.success && !data.job_id) {
        throw new Error(data.error || 'Failed to initialize scan job');
      }
      return data;
    })
    .then(data => {
      const jobId = data.job_id;
      title.innerText = 'Scan Queued...';
      sub.innerText = 'Job ID: ' + jobId;

      const pollInterval = setInterval(() => {
        fetch('/api/jobs/' + jobId)
          .then(res => res.json())
          .then(job => {
            if (!job || job.error) return;
            
            const pct = Math.round(job.progress || 0);
            title.innerText = `Scanning... ${pct}%`;
            sub.innerText = `Phase: ${job.status.toUpperCase()} | ${job.current_collector} (${job.opportunities_found} found, ${job.elapsed_time}s)`;

            if (job.status === 'completed') {
              clearInterval(pollInterval);
              title.innerText = 'Completed';
              sub.innerText = `✔ Scan Complete! Found ${job.opportunities_found} opportunities in ${job.elapsed_time}s.`;
              sub.className = 'text-success fw-bold fs-6 mb-0';

              spinner.style.display = 'none';
              icon.style.display = 'block';
              closeBtn.style.display = 'block';
              footerBtn.style.display = 'block';

              if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-play-circle me-1"></i> Run Scan Now';
              }

              setTimeout(() => {
                window.location.reload();
              }, 1500);
            } else if (job.status === 'failed') {
              clearInterval(pollInterval);
              title.innerText = 'Scan Failed';
              const errText = (job.errors && job.errors.length) ? job.errors.join('; ') : 'Pipeline execution failed';
              sub.innerText = 'Error: ' + errText;
              sub.className = 'text-danger mb-0';

              spinner.style.display = 'none';
              closeBtn.style.display = 'block';
              footerBtn.style.display = 'block';

              if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-play-circle me-1"></i> Run Scan Now';
              }
            }
          })
          .catch(pollErr => {
            console.error('Job polling error:', pollErr);
          });
      }, 2500);
    })
    .catch(e => {
      title.innerText = 'Scan Notice';
      sub.innerText = String(e.message || e);
      sub.className = 'text-warning fw-bold mb-0';

      spinner.style.display = 'none';
      closeBtn.style.display = 'block';
      footerBtn.style.display = 'block';

      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-play-circle me-1"></i> Run Scan Now';
      }
    });
}
</script>
