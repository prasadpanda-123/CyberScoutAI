<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberScout AI — Web Dashboard & Control Center</title>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Custom Design System & Accessible Theme -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">

  <!-- Immediate Theme Initialization Script -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('cyberscout-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body>
  {% include 'navbar.html' %}
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-2 d-none d-md-block p-0">
        {% include 'sidebar.html' %}
      </div>
      <main class="col-md-10 ms-sm-auto p-4">
        {% block content %}{% endblock %}
        {% include 'footer.html' %}
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('cyberscout-theme', newTheme);
      updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
      const btnIcon = document.getElementById('themeToggleIcon');
      if (btnIcon) {
        if (theme === 'light') {
          btnIcon.className = 'bi bi-moon-stars-fill text-warning';
        } else {
          btnIcon.className = 'bi bi-sun-fill text-warning';
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const activeTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      updateThemeIcon(activeTheme);
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
