{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold text-light mb-0"><i class="bi bi-gear text-primary me-2"></i> Configuration Editor</h2>
  <div>
    <button class="btn btn-outline-secondary btn-sm me-2" onclick="location.reload()"><i class="bi bi-arrow-clockwise me-1"></i> Reload</button>
    <button class="btn btn-success btn-sm" onclick="saveConfig()"><i class="bi bi-save me-1"></i> Save Changes</button>
  </div>
</div>

<div class="row g-4">
  {% for name, content in configs.items() %}
  <div class="col-md-6">
    <div class="card p-3">
      <div class="card-header border-0 bg-transparent ps-0 d-flex justify-content-between">
        <span><i class="bi bi-file-code text-info me-1"></i> {{ name }}</span>
        <span class="badge bg-secondary">YAML</span>
      </div>
      <textarea class="form-control bg-dark text-success font-monospace border-secondary" rows="8">{{ content }}</textarea>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}

{% block scripts %}
<script>
function saveConfig() {
  fetch('/api/config/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) })
    .then(async r => {
      const contentType = r.headers.get('content-type') || '';
      if (contentType.includes('application/json')) {
        return r.json();
      } else {
        const text = await r.text();
        throw new Error('Server returned HTTP ' + r.status);
      }
    })
    .then(d => alert(d.message || d.status))
    .catch(e => alert('Error saving config: ' + (e.message || e)));
}
</script>
{% endblock %}
