{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold mb-0"><i class="bi bi-gear text-primary me-2"></i> Configuration Editor</h2>
  <div>
    <button class="btn btn-outline-secondary btn-sm me-2" onclick="location.reload()"><i class="bi bi-arrow-clockwise me-1"></i> Reload</button>
    <button class="btn btn-success btn-sm" onclick="saveConfig()"><i class="bi bi-save me-1"></i> Save Changes</button>
  </div>
</div>

<div class="row g-4">
  {% for name, content in configs.items() %}
  <div class="col-md-6">
    <div class="card p-3 shadow-sm">
      <div class="card-header border-0 bg-transparent ps-0 d-flex justify-content-between align-items-center">
        <span class="fw-bold"><i class="bi bi-file-code text-info me-1"></i> {{ name }}</span>
        <span class="badge bg-secondary">YAML</span>
      </div>
      <textarea class="form-control font-monospace" rows="8">{{ content }}</textarea>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
function saveConfig() {
  alert('Configuration editing is centralized in the Admin Portal.');
}
</script>
{% endblock %}
