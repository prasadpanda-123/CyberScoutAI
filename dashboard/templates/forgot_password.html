<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyberScout AI — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('cyberscout-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
<div class="container" style="max-width: 420px;">
  <div class="card p-4 shadow-lg">
    <div class="text-center mb-4">
      <h3 class="fw-bold text-info"><i class="bi bi-key-fill me-2"></i>Reset Password</h3>
      <span class="text-muted small d-block">Enter your registered email address</span>
    </div>

    <form method="POST" action="/forgot-password">
      <div class="mb-3">
        <label class="form-label small text-muted">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="user@cyberscout.ai" required autofocus>
      </div>
      <button type="submit" class="btn btn-info text-white w-100 fw-bold py-2 mt-2"><i class="bi bi-send me-1"></i> Send Reset Link</button>
    </form>

    <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--border-subtle) !important;">
      <a href="/login" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
    </div>
  </div>
</div>
</body>
</html>
