<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyberScout AI — Reset Password</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body { background-color: #0B0F19; color: #E2E8F0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background-color: #111827; border: 1px solid #1E293B; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
<div class="container" style="max-width: 420px;">
  <div class="card p-4">
    <div class="text-center mb-4">
      <h3 class="fw-bold text-info"><i class="bi bi-key-fill me-2"></i>Reset Password</h3>
      <span class="text-muted small d-block">Enter your registered email address</span>
    </div>

    <form method="POST" action="/forgot-password">
      <div class="mb-3">
        <label class="form-label small text-muted">Email Address</label>
        <input type="email" name="email" class="form-control bg-dark text-light border-secondary" placeholder="user@cyberscout.ai" required autofocus>
      </div>
      <button type="submit" class="btn btn-info w-100 fw-bold py-2 mt-2"><i class="bi bi-send me-1"></i> Send Reset Link</button>
    </form>

    <div class="text-center mt-4 pt-3 border-top border-secondary">
      <a href="/login" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
    </div>
  </div>
</div>
</body>
</html>
