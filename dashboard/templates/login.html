<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyberScout AI — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('cyberscout-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
<div class="container" style="max-width: 420px;">
  <div class="card p-4 shadow-lg">
    <div class="text-center mb-4">
      <h3 class="fw-bold text-primary"><i class="bi bi-shield-lock-fill me-2"></i>CyberScout AI</h3>
      <span class="text-muted small d-block">Production Opportunity Intelligence Platform</span>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label small text-muted">Username or Email</label>
        <div class="input-group">
          <span class="input-group-text border-subtle text-muted"><i class="bi bi-person"></i></span>
          <input type="text" name="identifier" class="form-control" placeholder="admin@cyberscout.ai" required autofocus>
        </div>
      </div>
      <div class="mb-3">
        <div class="d-flex justify-content-between">
          <label class="form-label small text-muted">Password</label>
          <a href="/forgot-password" class="small text-primary text-decoration-none">Forgot?</a>
        </div>
        <div class="input-group">
          <span class="input-group-text border-subtle text-muted"><i class="bi bi-key"></i></span>
          <input type="password" name="password" class="form-control" placeholder="••••••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</button>
    </form>

    <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--border-subtle) !important;">
      <span class="text-muted small">Don't have an account?</span>
      <a href="/register" class="text-primary small fw-bold text-decoration-none ms-1">Register Account</a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
