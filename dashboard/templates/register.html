<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyberScout AI — Register Account</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body { background-color: #0B0F19; color: #E2E8F0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background-color: #111827; border: 1px solid #1E293B; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .btn-success { background-color: #059669; border: none; }
    .btn-success:hover { background-color: #047857; }
  </style>
</head>
<body>
<div class="container" style="max-width: 460px;">
  <div class="card p-4">
    <div class="text-center mb-4">
      <h3 class="fw-bold text-success"><i class="bi bi-person-plus-fill me-2"></i>Create Account</h3>
      <span class="text-muted small d-block">Join CyberScout AI Intelligence Platform</span>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/register">
      <div class="mb-3">
        <label class="form-label small text-muted">Username</label>
        <input type="text" name="username" class="form-control bg-dark text-light border-secondary" placeholder="secops_operator" required>
      </div>
      <div class="mb-3">
        <label class="form-label small text-muted">Email Address</label>
        <input type="email" name="email" class="form-control bg-dark text-light border-secondary" placeholder="operator@cyberscout.ai" required>
      </div>
      <div class="mb-3">
        <label class="form-label small text-muted">Requested Role</label>
        <select name="role" class="form-select bg-dark text-light border-secondary">
          <option value="Operator" selected>Operator (View & Export Reports)</option>
          <option value="Viewer">Viewer (Read-Only Access)</option>
          <option value="Administrator">Administrator (Manage Collectors & Scheduler)</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label small text-muted">Password</label>
        <input type="password" name="password" class="form-control bg-dark text-light border-secondary" placeholder="••••••••••••" required>
      </div>
      <div class="mb-3">
        <label class="form-label small text-muted">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control bg-dark text-light border-secondary" placeholder="••••••••••••" required>
      </div>
      <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2"><i class="bi bi-check-circle me-1"></i> Register Account</button>
    </form>

    <div class="text-center mt-4 pt-3 border-top border-secondary">
      <span class="text-muted small">Already have an account?</span>
      <a href="/login" class="text-info small fw-bold text-decoration-none ms-1">Sign In</a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
