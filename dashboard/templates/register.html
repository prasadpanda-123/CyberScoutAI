<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyberScout AI — Register Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('cyberscout-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
<div class="container" style="max-width: 460px;">
  <div class="card p-4 shadow-lg">
    <div class="text-center mb-4">
      <h3 class="fw-bold text-success"><i class="bi bi-person-plus-fill me-2"></i>Create Account</h3>
      <span class="text-muted small d-block">Join CyberScout AI Intelligence Platform</span>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/register">
      <div class="mb-3">
        <label class="form-label small text-muted">Username</label>
        <input type="text" name="username" class="form-control" placeholder="secops_operator" required>
      </div>
      <div class="mb-3">
        <label class="form-label small text-muted">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="operator@cyberscout.ai" required>
      </div>
      <div class="mb-3">
        <label class="form-label small text-muted">Requested Role</label>
        <select name="role" class="form-select">
          <option value="Operator" selected>Operator (View & Export Reports)</option>
          <option value="Viewer">Viewer (Read-Only Access)</option>
          <option value="Administrator">Administrator (Manage Collectors & Scheduler)</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label small text-muted">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••••••" required>
      </div>
      <div class="mb-3">
        <label class="form-label small text-muted">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••••••" required>
      </div>
      <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2"><i class="bi bi-check-circle me-1"></i> Register Account</button>
    </form>

    <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--border-subtle) !important;">
      <span class="text-muted small">Already have an account?</span>
      <a href="/login" class="text-primary small fw-bold text-decoration-none ms-1">Sign In</a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
