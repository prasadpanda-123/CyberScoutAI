<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberScout AI Report</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f6f8; color: #333333;">
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f4f6f8; padding: 20px 0;">
    <tr>
      <td align="center">
        <table border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
          <!-- HEADER -->
          <tr>
            <td>
              {% include 'header.html' %}
            </td>
          </tr>
          <!-- CONTENT -->
          <tr>
            <td style="padding: 20px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <!-- FOOTER -->
          <tr>
            <td>
              {% include 'footer.html' %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
