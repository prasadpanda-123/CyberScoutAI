# sources.yaml
# Static configuration for collectors.
# Runtime state such as last_run_status belongs in the database, not here.
# collection_method: rss | api | html | playwright
# default_category maps to the taxonomy in keywords.yaml and the architecture docs.

sources:

  - id: github_search
    name: "GitHub Search API"
    collection_method: api
    supports_search: true
    supports_rss: false
    requires_login: true
    requires_playwright: false
    official: true
    trust_score: 0.92
    maintenance_level: stable
    update_frequency: daily
    max_requests_per_run: 30
    request_delay_ms: 1000
    base_url: "https://api.github.com/search/repositories"
    default_category: security_tool
    priority: P0
    enabled: true

