# Default configuration for CyberScout AI

app_env: "development"

# Logging settings
logging:
  level: "INFO"
  file: "logs/cyberscout.log"
  max_bytes: 10485760 # 10MB
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Database settings
database:
  provider: "postgresql"
