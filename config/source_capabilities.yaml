# Source Capabilities Registry for CyberScout AI

sources:
  github_search:
    name: "GitHub Search API"
    supports_search: true
    supports_api: true
    supports_rss: false
    authentication_required: false
    priority: 1
    supported_categories:
      - github_repository
      - security_tool
      - ctf
    rate_limit_requests_per_minute: 30
    preferred_collector: "GithubSearchCollector"

  ctftime:
    name: "CTFtime Events API"
    supports_search: false
    supports_api: true
    supports_rss: false
    authentication_required: false
    priority: 1
    supported_categories:
      - ctf
    rate_limit_requests_per_minute: 60
    preferred_collector: "CtftimeCollector"

  thehackernews:
    name: "The Hacker News RSS"
    supports_search: false
    supports_api: false
